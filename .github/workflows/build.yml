name: Build GTSTORE PS4 PKG

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout do Codigo
      uses: actions/checkout@v4

    - name: Instalar Compiladores
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make python3

    - name: Baixar OOSDK (OpenOrbis Toolchain)
      run: |
        echo "A descarregar o OOSDK..."
        curl -sL https://github.com/LightningMods/OpenOrbis-PS4-Toolchain/releases/download/v0.50001/OOSDK.tar.gz | tar -xz -C "$GITHUB_WORKSPACE"
        chmod +x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/"*
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    - name: Gerar param.sfo
      run: python3 gerar_sfo.py

    - name: Compilar Codigo e Gerar PKG
      run: make

    - name: Guardar o Artefacto PKG
      uses: actions/upload-artifact@v4
      with:
        name: GTSTORE-Client-Pkg
        path: |
          *.pkg
          eboot.bin
