name: Build GTSTORE PS4 PKG

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Instalar Compiladores
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make python3

    - name: Baixar OOSDK (OpenOrbis Toolchain)
      run: |
        echo "A descarregar o OOSDK..."
        curl -sL https://github.com/LightningMods/OpenOrbis-PS4-Toolchain/releases/download/v0.50001/OOSDK.tar.gz | tar -xz -C "$GITHUB_WORKSPACE"
        chmod +x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/"*
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    - name: Gerar param.sfo Válido e Estruturado
      run: |
        mkdir -p sce_sys
        python3 - << 'EOF'
        import struct

        def write_sfo():
            magic = b'\x00PSF'
            version = b'\x01\x01\x00\x00'
            
            # 0x0404 para inteiros e 0x0200 para strings UTF-8 exigidos pelo SFO da PS4
            entries = [
                ("APP_TYPE", 0x0404, 4, struct.pack("<I", 0)),
                ("TITLE", 0x0200, 64, "GTSTORE".encode('utf-8') + b'\x00'),
                ("TITLE_ID", 0x0200, 16, "NPXS39041".encode('utf-8') + b'\x00'),
            ]
            
            count = len(entries)
            header_size = 20
            index_table_size = count * 16
            key_table_offset = header_size + index_table_size
            
            keys_data = bytearray()
            vals_data = bytearray()
            index_entries = []
            
            current_key_off = 0
            current_val_off = 0
            
            for key, fmt, max_len, val_bytes in entries:
                key_bytes = key.encode('utf-8') + b'\x00'
                key_off = current_key_off
                current_key_off += len(key_bytes)
                keys_data.extend(key_bytes)
                
                padded_val = val_bytes + b'\x00' * (max_len - len(val_bytes))
                val_off = current_val_off
                current_val_off += len(padded_val)
                vals_data.extend(padded_val)
                
                data_len = len(val_bytes)
                index_entries.append((key_off, fmt, data_len, max_len, val_off))

            data_table_offset = key_table_offset + len(keys_data)
            
            with open('sce_sys/param.sfo', 'wb') as f:
                f.write(magic)
                f.write(version)
                f.write(struct.pack("<I", key_table_offset))
                f.write(struct.pack("<I", data_table_offset))
                f.write(struct.pack("<I", count))
                
                for key_off, fmt, data_len, max_len, val_off in index_entries:
                    f.write(struct.pack("<HHIII", key_off, fmt, data_len, max_len, val_off))
                    
                f.write(keys_data)
                f.write(vals_data)

        write_sfo()
        print("param.sfo gerado com sucesso!")
        EOF

    - name: Compilar Código e Gerar PKG
      run: |
        make

    - name: Guardar o Artefacto PKG
      uses: actions/upload-artifact@v4
      with:
        name: GTSTORE-Client-Pkg
        path: |
          *.pkg
          homebrew.elf
